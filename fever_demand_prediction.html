<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Prediction Agent · Fever Agentforce Studio</title>
    <!-- Favicon -->
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Salesforce.com_logo.svg/120px-Salesforce.com_logo.svg.png" type="image/x-icon">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0C;
            color: #E4E4E7;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #18181B; }
        ::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525B; }

        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Sidebar oscuro con gradiente */
        .sidebar-dark {
            background: linear-gradient(180deg, #18181B 0%, #0A0A0C 100%);
            border-right: 1px solid #27272A;
        }

        /* Branding gradient Fever */
        .fever-gradient-text {
            background: linear-gradient(135deg, #FF0050 0%, #7D27FF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .fever-gradient-bg {
            background: linear-gradient(135deg, #FF0050 0%, #7D27FF 100%);
        }

        /* Alerta con efecto neón pulsante */
        .alert-neon {
            background: linear-gradient(135deg, rgba(255,0,80,0.12) 0%, rgba(125,39,255,0.08) 100%);
            border: 1px solid rgba(255,0,80,0.4);
            box-shadow:
                0 0 0 1px rgba(255,0,80,0.15) inset,
                0 0 40px rgba(255,0,80,0.15),
                0 0 80px rgba(255,0,80,0.05);
        }

        @keyframes pulseDot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,0,80,0.7); }
            50% { box-shadow: 0 0 0 8px rgba(255,0,80,0); }
        }
        .pulse-dot {
            animation: pulseDot 1.6s ease-in-out infinite;
        }

        /* Tarjetas oscuras */
        .card-dark {
            background-color: #18181B;
            border: 1px solid #27272A;
        }
        .card-dark:hover {
            border-color: #3F3F46;
        }

        /* Botón principal con glow */
        .btn-primary {
            background: linear-gradient(135deg, #FF0050 0%, #7D27FF 100%);
            transition: all 0.25s ease;
            box-shadow: 0 0 0 0 rgba(255,0,80,0.4);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255,0,80,0.35), 0 4px 12px rgba(125,39,255,0.25);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            background: #27272A;
            color: #71717A;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Checkbox custom */
        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 1.5px solid #52525B;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
            flex-shrink: 0;
        }
        .custom-checkbox.checked {
            background: linear-gradient(135deg, #FF0050 0%, #7D27FF 100%);
            border-color: transparent;
            box-shadow: 0 0 0 2px rgba(255,0,80,0.15);
        }
        .custom-checkbox i {
            font-size: 11px;
            color: white;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }
        .custom-checkbox.checked i {
            opacity: 1;
            transform: scale(1);
        }

        /* Toast de éxito */
        .toast-enter {
            animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Status badge optimizado */
        .status-optimized {
            background: linear-gradient(135deg, rgba(34,197,94,0.15) 0%, rgba(34,197,94,0.05) 100%);
            border: 1px solid rgba(34,197,94,0.4);
            color: #4ADE80;
        }

        /* Sparkle / shimmer */
        .shimmer-bar {
            position: relative;
            overflow: hidden;
        }
        .shimmer-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            animation: shimmer 2.5s infinite;
        }
        @keyframes shimmer {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        .nav-item-active {
            background: linear-gradient(90deg, rgba(255,0,80,0.12) 0%, rgba(125,39,255,0.06) 100%);
            border-left: 3px solid #FF0050;
            color: #FFFFFF;
        }
        .nav-item {
            border-left: 3px solid transparent;
            color: #A1A1AA;
            transition: all 0.2s ease;
        }
        .nav-item:hover {
            background: rgba(255,255,255,0.03);
            color: #E4E4E7;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function DemandPredictionDashboard() {
            const [loaded, setLoaded] = useState(false);
            const [recommendations, setRecommendations] = useState([
                { id: 1, label: "Incrementar presupuesto paid media Madrid +40%", checked: true, icon: "fa-bullseye-arrow", detail: "Reasignación automática desde campañas de menor performance" },
                { id: 2, label: "Activar campaña lookalike 'Superfan Pop Madrid'", checked: true, icon: "fa-users-viewfinder", detail: "Audiencia de 28K usuarios similares al núcleo de superfans" },
                { id: 3, label: "Evaluar 2ª fecha (Fill rate proyectado: 94%)", checked: true, icon: "fa-calendar-plus", detail: "Modelo predice >7,500 entradas vendidas para una fecha adicional" }
            ]);
            const [approved, setApproved] = useState(false);
            const [showToast, setShowToast] = useState(false);

            useEffect(() => {
                setLoaded(true);
            }, []);

            const toggleRecommendation = (id) => {
                if (approved) return;
                setRecommendations(prev => prev.map(r => r.id === id ? { ...r, checked: !r.checked } : r));
            };

            const handleApprove = () => {
                if (approved) return;
                setApproved(true);
                setShowToast(true);
                setTimeout(() => setShowToast(false), 4500);
            };

            const checkedCount = recommendations.filter(r => r.checked).length;

            return (
                <div className="h-screen flex bg-[#0A0A0C] text-[#E4E4E7]">

                    {/* SIDEBAR */}
                    <aside className="w-60 sidebar-dark shrink-0 flex flex-col">

                        {/* Logo / Branding */}
                        <div className="px-5 py-5 border-b border-[#27272A] flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-lg fever-gradient-bg flex items-center justify-center shadow-lg shadow-[#FF0050]/20">
                                <i className="fa-solid fa-bolt text-white text-[16px]"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-[14px] text-white leading-tight">Agentforce</h1>
                                <p className="text-[10px] text-[#A1A1AA] leading-tight uppercase tracking-wider">Studio · Fever</p>
                            </div>
                        </div>

                        {/* Nav items */}
                        <nav className="flex-1 py-4 text-[13px]">
                            <p className="px-5 text-[10px] uppercase tracking-[0.15em] text-[#71717A] font-semibold mb-2">Workspace</p>
                            <a className="nav-item flex items-center gap-3 px-5 py-2.5 cursor-pointer">
                                <i className="fa-solid fa-house w-4 text-center"></i> Home
                            </a>
                            <a className="nav-item-active flex items-center gap-3 px-5 py-2.5 cursor-pointer font-medium">
                                <i className="fa-solid fa-chart-line w-4 text-center"></i> Demand Prediction
                                <span className="ml-auto bg-[#FF0050] text-white text-[9px] font-bold px-1.5 py-0.5 rounded">1</span>
                            </a>
                            <a className="nav-item flex items-center gap-3 px-5 py-2.5 cursor-pointer">
                                <i className="fa-solid fa-bullhorn w-4 text-center"></i> Campaigns
                            </a>
                            <a className="nav-item flex items-center gap-3 px-5 py-2.5 cursor-pointer">
                                <i className="fa-solid fa-users w-4 text-center"></i> Audiences
                            </a>
                            <a className="nav-item flex items-center gap-3 px-5 py-2.5 cursor-pointer">
                                <i className="fa-solid fa-ticket w-4 text-center"></i> Events
                            </a>

                            <p className="px-5 text-[10px] uppercase tracking-[0.15em] text-[#71717A] font-semibold mt-6 mb-2">Agents</p>
                            <a className="nav-item flex items-center gap-3 px-5 py-2.5 cursor-pointer">
                                <i className="fa-solid fa-robot w-4 text-center"></i> Demand Predictor
                            </a>
                            <a className="nav-item flex items-center gap-3 px-5 py-2.5 cursor-pointer">
                                <i className="fa-solid fa-wand-magic-sparkles w-4 text-center"></i> Creative Optimizer
                            </a>
                            <a className="nav-item flex items-center gap-3 px-5 py-2.5 cursor-pointer">
                                <i className="fa-solid fa-comments w-4 text-center"></i> Conversational
                            </a>
                        </nav>

                        {/* User block */}
                        <div className="border-t border-[#27272A] p-4 flex items-center gap-3">
                            <div className="w-9 h-9 rounded-full fever-gradient-bg flex items-center justify-center text-white text-xs font-bold shrink-0">
                                JM
                            </div>
                            <div className="flex-1 min-w-0">
                                <p className="text-[12px] font-semibold text-white truncate">Javier Macías</p>
                                <p className="text-[10px] text-[#71717A] truncate">SVP Marketing · Fever</p>
                            </div>
                            <i className="fa-solid fa-gear text-[#71717A] hover:text-white cursor-pointer transition"></i>
                        </div>
                    </aside>

                    {/* MAIN CONTENT */}
                    <main className={`flex-1 flex flex-col overflow-hidden ${loaded ? 'fade-in' : 'opacity-0'}`}>

                        {/* TOP BAR */}
                        <header className="h-14 border-b border-[#27272A] flex items-center justify-between px-6 shrink-0 bg-[#0A0A0C]/80 backdrop-blur">
                            <div className="flex items-center gap-3 text-[13px]">
                                <span className="text-[#71717A]">Agentforce Studio</span>
                                <i className="fa-solid fa-chevron-right text-[10px] text-[#52525B]"></i>
                                <span className="text-white font-medium">Demand Prediction Agent</span>
                            </div>
                            <div className="flex items-center gap-5 text-[#A1A1AA]">
                                <div className="hidden md:flex items-center gap-2 text-[11px] bg-[#18181B] border border-[#27272A] rounded-md px-2.5 py-1.5">
                                    <span className="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                                    <span>Live data · Última señal hace 2 min</span>
                                </div>
                                <i className="fa-regular fa-bell hover:text-white cursor-pointer transition"></i>
                                <i className="fa-solid fa-magnifying-glass hover:text-white cursor-pointer transition"></i>
                            </div>
                        </header>

                        {/* SCROLLABLE CONTENT */}
                        <div className="flex-1 overflow-y-auto">
                            <div className="max-w-6xl mx-auto px-8 py-8 space-y-6">

                                {/* PAGE TITLE */}
                                <div className="flex items-end justify-between">
                                    <div>
                                        <p className="text-[11px] uppercase tracking-[0.18em] text-[#FF0050] font-semibold mb-2">Real-Time Insight</p>
                                        <h2 className="text-3xl font-bold text-white">Predicciones de demanda</h2>
                                        <p className="text-[13px] text-[#A1A1AA] mt-1">Señales detectadas por el agente en las últimas 24h · 7 mercados activos</p>
                                    </div>
                                    <div className="flex items-center gap-2 text-[12px] text-[#A1A1AA]">
                                        <i className="fa-regular fa-clock"></i>
                                        <span>Actualizado: hoy, 10:48</span>
                                    </div>
                                </div>

                                {/* ALERT CARD - HERO */}
                                <div className="alert-neon rounded-2xl p-7 relative overflow-hidden slide-up">
                                    {/* Glow blob decorativo */}
                                    <div className="absolute top-0 right-0 w-72 h-72 bg-[#FF0050]/10 rounded-full blur-3xl pointer-events-none -mr-20 -mt-20"></div>
                                    <div className="absolute bottom-0 left-1/3 w-48 h-48 bg-[#7D27FF]/10 rounded-full blur-3xl pointer-events-none"></div>

                                    <div className="relative">
                                        <div className="flex items-start justify-between mb-5">
                                            <div className="flex items-center gap-3">
                                                <div className="relative">
                                                    <div className="w-3 h-3 rounded-full bg-[#FF0050] pulse-dot"></div>
                                                </div>
                                                <span className="text-[11px] uppercase tracking-[0.2em] font-bold text-[#FF0050]">🔴 Alerta Demand Prediction</span>
                                            </div>
                                            <span className="text-[10px] text-[#A1A1AA] bg-black/30 border border-[#27272A] px-2 py-1 rounded font-medium uppercase tracking-wider">Prioridad alta</span>
                                        </div>

                                        <h3 className="text-[28px] font-bold text-white leading-tight mb-2">
                                            Madrid · 15 de Junio · <span className="fever-gradient-text">Pop Electrónico</span>
                                        </h3>
                                        <p className="text-[14px] text-[#D4D4D8] leading-relaxed max-w-2xl mb-6">
                                            El agente ha detectado un <strong className="text-white">pico de búsquedas y wishlist saves</strong> sobre artistas pop-electrónicos
                                            en Madrid para mediados de junio. La oferta de venues confirmados está muy por debajo de la demanda señalada.
                                        </p>

                                        {/* INSIGHTS */}
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            {/* Señal de demanda */}
                                            <div className="bg-black/30 border border-[#27272A] rounded-xl p-4 backdrop-blur">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <i className="fa-solid fa-signal text-[#FF0050] text-[12px]"></i>
                                                    <span className="text-[10px] uppercase tracking-wider text-[#A1A1AA] font-semibold">Señal de demanda</span>
                                                </div>
                                                <div className="flex items-baseline gap-2">
                                                    <span className="text-2xl font-bold text-white">ALTA</span>
                                                    <span className="text-[11px] text-[#FF0050] font-bold">+312%</span>
                                                </div>
                                                <div className="mt-3 h-1.5 bg-[#27272A] rounded-full overflow-hidden shimmer-bar">
                                                    <div className="h-full fever-gradient-bg rounded-full" style={{ width: '92%' }}></div>
                                                </div>
                                            </div>

                                            {/* Audiencia potencial */}
                                            <div className="bg-black/30 border border-[#27272A] rounded-xl p-4 backdrop-blur">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <i className="fa-solid fa-users text-[#7D27FF] text-[12px]"></i>
                                                    <span className="text-[10px] uppercase tracking-wider text-[#A1A1AA] font-semibold">Audiencia potencial</span>
                                                </div>
                                                <div className="flex items-baseline gap-2">
                                                    <span className="text-2xl font-bold text-white">45,000</span>
                                                    <span className="text-[11px] text-[#A1A1AA]">superfans</span>
                                                </div>
                                                <p className="text-[10px] text-[#71717A] mt-3 leading-snug">Modelados desde Data Cloud · histórico + intent</p>
                                            </div>

                                            {/* Capacidad venue */}
                                            <div className="bg-black/30 border border-[#27272A] rounded-xl p-4 backdrop-blur">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <i className="fa-solid fa-building text-[#FB923C] text-[12px]"></i>
                                                    <span className="text-[10px] uppercase tracking-wider text-[#A1A1AA] font-semibold">Capacidad venue</span>
                                                </div>
                                                <div className="flex items-baseline gap-2">
                                                    <span className="text-2xl font-bold text-white">8,000</span>
                                                    <span className="text-[11px] text-amber-400 font-bold">Gap: 37K</span>
                                                </div>
                                                <p className="text-[10px] text-[#71717A] mt-3 leading-snug">Demanda &gt;&gt; oferta · Ratio 5.6×</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* RECOMENDACIONES + APROBACIÓN */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                                    {/* RECOMENDACIONES (col 1+2) */}
                                    <div className="lg:col-span-2 card-dark rounded-2xl p-6">
                                        <div className="flex items-center justify-between mb-1">
                                            <div className="flex items-center gap-2.5">
                                                <i className="fa-solid fa-wand-magic-sparkles text-[#FF0050]"></i>
                                                <h3 className="text-[15px] font-bold text-white">Recomendaciones del Agente</h3>
                                            </div>
                                            <span className="text-[10px] text-[#A1A1AA] bg-[#27272A] px-2 py-1 rounded uppercase tracking-wider font-semibold">
                                                {checkedCount} / {recommendations.length} seleccionadas
                                            </span>
                                        </div>
                                        <p className="text-[12px] text-[#71717A] mb-5">Acciones automatizadas listas para ejecutar bajo aprobación humana.</p>

                                        <div className="space-y-3">
                                            {recommendations.map((rec) => (
                                                <div
                                                    key={rec.id}
                                                    onClick={() => toggleRecommendation(rec.id)}
                                                    className={`border rounded-xl p-4 flex items-start gap-4 transition-all ${
                                                        approved
                                                            ? 'border-[#27272A] bg-[#0E0E10] cursor-default'
                                                            : 'border-[#27272A] bg-[#0E0E10] hover:border-[#FF0050]/50 cursor-pointer'
                                                    } ${rec.checked ? 'border-[#FF0050]/30' : ''}`}>

                                                    <div className={`custom-checkbox ${rec.checked ? 'checked' : ''} mt-0.5`}>
                                                        <i className="fa-solid fa-check"></i>
                                                    </div>

                                                    <div className="flex-1 min-w-0">
                                                        <p className={`text-[14px] font-semibold leading-tight ${rec.checked ? 'text-white' : 'text-[#A1A1AA]'}`}>
                                                            {rec.label}
                                                        </p>
                                                        <p className="text-[11px] text-[#71717A] mt-1 leading-snug">{rec.detail}</p>
                                                    </div>

                                                    {rec.checked && (
                                                        <span className="text-[10px] uppercase tracking-wider font-bold fever-gradient-text shrink-0 mt-1">
                                                            Activa
                                                        </span>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* APROBACIÓN (col 3) */}
                                    <div className="card-dark rounded-2xl p-6 flex flex-col">
                                        <div className="flex items-center gap-2.5 mb-1">
                                            <i className="fa-solid fa-shield-halved text-[#7D27FF]"></i>
                                            <h3 className="text-[15px] font-bold text-white">Human-in-the-loop</h3>
                                        </div>
                                        <p className="text-[12px] text-[#71717A] mb-6">Tu aprobación dispara la ejecución en tiempo real sobre los canales activos.</p>

                                        {/* Estado dinámico */}
                                        {!approved ? (
                                            <div className="bg-[#0E0E10] border border-[#27272A] rounded-xl p-4 mb-6">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <span className="w-2 h-2 rounded-full bg-amber-400 pulse-dot"></span>
                                                    <span className="text-[11px] uppercase tracking-wider text-amber-400 font-bold">Pendiente de aprobación</span>
                                                </div>
                                                <p className="text-[12px] text-[#A1A1AA] leading-relaxed">
                                                    {checkedCount} acciones agénticas seleccionadas, listas para activar.
                                                </p>
                                            </div>
                                        ) : (
                                            <div className="status-optimized rounded-xl p-4 mb-6 fade-in">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <i className="fa-solid fa-circle-check text-[#4ADE80] text-[12px]"></i>
                                                    <span className="text-[11px] uppercase tracking-wider font-bold text-[#4ADE80]">Campaña Optimizada en Tiempo Real</span>
                                                </div>
                                                <p className="text-[12px] text-[#86EFAC] leading-relaxed">
                                                    {checkedCount} acciones ejecutadas · Marketing Cloud, Data Cloud y Ads sincronizados.
                                                </p>
                                            </div>
                                        )}

                                        {/* Botón principal */}
                                        <button
                                            onClick={handleApprove}
                                            disabled={approved || checkedCount === 0}
                                            className="btn-primary text-white font-bold text-[14px] py-3.5 px-5 rounded-xl flex items-center justify-center gap-2 mt-auto">
                                            {approved ? (
                                                <>
                                                    <i className="fa-solid fa-check"></i>
                                                    Acciones Aprobadas
                                                </>
                                            ) : (
                                                <>
                                                    <i className="fa-solid fa-bolt"></i>
                                                    Aprobar Acciones Agénticas
                                                </>
                                            )}
                                        </button>

                                        <p className="text-[10px] text-[#52525B] mt-3 text-center">
                                            <i className="fa-solid fa-lock mr-1"></i>
                                            Auditado · trazabilidad completa en Agentforce
                                        </p>
                                    </div>
                                </div>

                                {/* FOOTER STATS BAR */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 pt-2 pb-6">
                                    <div className="card-dark rounded-xl px-4 py-3">
                                        <p className="text-[10px] uppercase tracking-wider text-[#71717A] font-semibold">Confianza modelo</p>
                                        <p className="text-[18px] font-bold text-white mt-1">96.4%</p>
                                    </div>
                                    <div className="card-dark rounded-xl px-4 py-3">
                                        <p className="text-[10px] uppercase tracking-wider text-[#71717A] font-semibold">Fill rate proyectado</p>
                                        <p className="text-[18px] font-bold text-white mt-1">94%</p>
                                    </div>
                                    <div className="card-dark rounded-xl px-4 py-3">
                                        <p className="text-[10px] uppercase tracking-wider text-[#71717A] font-semibold">Revenue uplift</p>
                                        <p className="text-[18px] font-bold fever-gradient-text mt-1">+€820K</p>
                                    </div>
                                    <div className="card-dark rounded-xl px-4 py-3">
                                        <p className="text-[10px] uppercase tracking-wider text-[#71717A] font-semibold">Tiempo a ejecución</p>
                                        <p className="text-[18px] font-bold text-white mt-1">&lt; 90s</p>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </main>

                    {/* TOAST de éxito */}
                    {showToast && (
                        <div className="fixed bottom-8 left-1/2 -translate-x-1/2 toast-enter z-50">
                            <div className="bg-[#18181B] border border-[#27272A] rounded-xl shadow-2xl px-5 py-4 flex items-center gap-4 min-w-[380px]">
                                <div className="w-10 h-10 rounded-full status-optimized flex items-center justify-center shrink-0">
                                    <i className="fa-solid fa-check text-[#4ADE80]"></i>
                                </div>
                                <div className="flex-1">
                                    <p className="text-[13px] font-bold text-white">Acciones agénticas aprobadas</p>
                                    <p className="text-[11px] text-[#A1A1AA] mt-0.5">Campaña optimizada en tiempo real · Ejecutándose en Marketing Cloud</p>
                                </div>
                                <button
                                    onClick={() => setShowToast(false)}
                                    className="text-[#71717A] hover:text-white transition shrink-0">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DemandPredictionDashboard />);
    </script>
</body>
</html>
