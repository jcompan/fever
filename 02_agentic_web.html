<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUNGLE en Movistar Arena Madrid · Fever</title>
    <!-- Favicon -->
    <link rel="icon" href="https://feverup.com/logo/fever-logo-black.svg" type="image/svg+xml">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0C; color: #E4E4E7; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525B; }

        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .chat-textarea {
            resize: none;
            min-height: 44px;
            max-height: 150px;
            line-height: 1.5;
            transition: height 0.1s ease;
        }

        .booking-link { color: #FF2D95; text-decoration: none; transition: all 0.2s; }
        .booking-link:hover { text-decoration: underline; }

        .fever-gradient { background: linear-gradient(135deg, #E9007F 0%, #C026D3 100%); }
        .fever-gradient-text {
            background: linear-gradient(135deg, #FF2D95 0%, #C026D3 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .fever-logo-circle {
            background: linear-gradient(135deg, #E9007F 0%, #C026D3 100%);
            color: white;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        .card-dark { background-color: #18181B; border: 1px solid #27272A; }
        .card-darker { background-color: #0E0E10; border: 1px solid #27272A; }

        @keyframes pulseDot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(233,0,127,0.7); }
            50% { box-shadow: 0 0 0 8px rgba(233,0,127,0); }
        }
        .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FEVER_MAGENTA = "#E9007F";
        const FEVER_LOGO = "https://feverup.com/logo/fever-logo-black.svg";
        const PRODUCT_IMG = "https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=1400&q=80";

        // Logo Fever oficial (SVG). Invert opcional para fondos oscuros.
        const FeverLogo = ({ className = "h-6", invert = false }) => (
            <img
                src={FEVER_LOGO}
                alt="Fever"
                className={`${className} object-contain`}
                style={invert ? { filter: 'brightness(0) invert(1)' } : {}}
            />
        );

        // Icono de marca dentro de círculo (para chat avatar y similares)
        const FeverIcon = ({ size = "w-full h-full" }) => (
            <div className={`${size} bg-black rounded-full flex items-center justify-center`}>
                <FeverLogo className="w-3/5 h-auto" invert />
            </div>
        );

        const PRODUCT_DATA = {
            event: "JUNGLE en Movistar Arena Madrid",
            shortName: "JUNGLE",
            artist: "Electronic Funk · Soul · Live Show",
            alternativeEvent: "Tame Impala en Movistar Arena Madrid",
            sku: "EVT-JUNGLE-MAD-150625",
            orderRef: "FEV-49281",
            tickets: "2 entradas General Admission",
            shortDesc: "15 jun · Madrid · Movistar Arena Madrid · Electronic Funk",
            doors: "Apertura puertas · 20:30",
            highlights: "Electronic Funk · Soul · Live Show · Plan en pareja",
            details: {
                date: "15 de junio de 2026",
                city: "Madrid",
                venue: "Movistar Arena Madrid",
                doors: "20:30",
                end: "00:30",
                ageLimit: "+16",
                headline: "JUNGLE en Movistar Arena Madrid · Electronic Funk · Soul · Live Show.",
                longDesc: "Plan moderno, urbano y bailable, perfecto para compartir en pareja. Un live show con sonido electrónico, funk y soul, en un venue de referencia en Madrid.",
                images: [
                    "https://images.unsplash.com/photo-1429962714451-bb934ecdc4ec?auto=format&fit=crop&w=1200&q=80",
                    "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1200&q=80",
                    "https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&w=1200&q=80"
                ],
                amenities: [
                    { icon: 'fa-music', name: 'Electronic Funk' },
                    { icon: 'fa-headphones', name: 'Live Show' },
                    { icon: 'fa-clock', name: '20:30 - 00:30' },
                    { icon: 'fa-location-dot', name: 'Movistar Arena' },
                    { icon: 'fa-people-group', name: 'Plan en pareja' },
                    { icon: 'fa-champagne-glasses', name: 'After-party' },
                    { icon: 'fa-id-card', name: '+16' }
                ]
            },
            includedServices: [
                "Acceso al recinto · JUNGLE en Movistar Arena Madrid",
                "2 entradas General Admission seleccionadas",
                "Cancelación flexible 48h antes del evento",
                "Tickets digitales con QR en la app de Fever"
            ],
            basePrice: 108.00,
            originalPrice: 108.00,
            discount: 0,
            extras: []
        };

        const PREMIUM_SERVICES = [
            {
                id: 'vip_experience',
                title: 'VIP EXPERIENCE',
                price: '+35,00 € por persona',
                image: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=800&q=80',
                shortDesc: 'Acceso prioritario, zona reservada y una experiencia más cómoda durante el evento.',
                desc: 'Mejora tu noche con una experiencia VIP diseñada para fans que buscan comodidad, acceso rápido y mejor visibilidad. Ideal para Elena, que suele comprar en pareja y muestra alta propensión a experiencias premium.',
                includes: [
                    'Acceso prioritario al venue',
                    'Zona reservada con mejor visibilidad',
                    'Copa de bienvenida incluida',
                    'Atención preferente en acceso'
                ],
                comments: 'Recomendado por Agentforce porque Elena compró una opción premium en su último evento y muestra alta afinidad por experiencias nocturnas.',
                tags: ['Alta propensión VIP', 'Upgrade recomendado'],
                unitPrice: 70 // 2 personas × 35€
            },
            {
                id: 'official_afterparty',
                title: 'AFTER-PARTY OFICIAL',
                price: '+45,00 € por persona',
                image: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80',
                shortDesc: 'Continúa la noche con acceso exclusivo al after-party oficial del evento.',
                desc: 'Una recomendación diseñada para extender el valor más allá del ticket. El after-party permite a Elena convertir el evento en una experiencia completa y aumenta el ancillary revenue por asistente.',
                includes: [
                    'Acceso al after-party oficial',
                    'Ambiente exclusivo para asistentes seleccionados',
                    'Entrada válida para 2 personas',
                    'Disponibilidad limitada'
                ],
                comments: 'Recomendado para fans con alta afinidad por experiencias nocturnas y planes sociales.',
                tags: ['Ancillary revenue', 'Disponibilidad limitada'],
                unitPrice: 90 // 2 personas × 45€
            },
            {
                id: 'fever_insider',
                title: 'FEVER INSIDER',
                price: '+9,99 € · activación',
                image: 'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&w=800&q=80',
                shortDesc: 'Beneficios personalizados, early access y progreso hacia tiers superiores.',
                desc: 'Fever Insider convierte cada compra en una relación continua. Elena acumula progreso por asistencia, upgrades y engagement, desbloqueando acceso anticipado, beneficios VIP y recomendaciones cada vez más precisas.',
                includes: [
                    'Acceso anticipado a eventos seleccionados',
                    'Progreso hacia tier Fever Regular',
                    'Recomendaciones personalizadas por afinidad',
                    'Beneficios futuros en experiencias premium'
                ],
                comments: 'Este bloque demuestra cómo Loyalty Management + Data Cloud + Agentforce convierten cada ticket en una relación de largo plazo.',
                tags: ['Loyalty Management', 'Fever Insider'],
                unitPrice: 9.99
            }
        ];

        function App() {
          const [isChatOpen, setIsChatOpen] = useState(false);
          const [latestAddedExtra, setLatestAddedExtra] = useState(null);
          const [selectedRecommendation, setSelectedRecommendation] = useState(null);

          // Estados omnicanal mock (reflejan abandono y retargeting WhatsApp)
          const [cartStatus, setCartStatus] = useState("active"); // active | abandoned | converted
          const [budgetStatus, setBudgetStatus] = useState("draft"); // draft | saved
          const [lastChannel, setLastChannel] = useState("email"); // email | web | whatsapp | app
          const [nextBestAction, setNextBestAction] = useState(null); // retarget_whatsapp

          // Estado dinámico del producto
          const [addedExtras, setAddedExtras] = useState(PRODUCT_DATA.extras);

          // Acordeones
          const [isStayOpen, setIsStayOpen] = useState(false);
          const [isRoomOpen, setIsRoomOpen] = useState(false);
          const [isPriceOpen, setIsPriceOpen] = useState(false);

          // Carrusel
          const [currentImageIndex, setCurrentImageIndex] = useState(0);

          // Widget flotante de servicios premium
          const [showServicesWidget, setShowServicesWidget] = useState(false);
          const [expandedServiceId, setExpandedServiceId] = useState(null);

          const [messages, setMessages] = useState([]);
          const [inputText, setInputText] = useState('');
          const [isTyping, setIsTyping] = useState(false);
          const [demoStep, setDemoStep] = useState(0);

          const [isSimulatingInput, setIsSimulatingInput] = useState(false);
          const [isWaitingForAgentTrigger, setIsWaitingForAgentTrigger] = useState(false);

          const skipInputTypingRef = useRef(false);
          const typingTimeoutRef = useRef(null);
          const textareaRef = useRef(null);
          const chatEndRef = useRef(null);
          const lastMessageRef = useRef(null);

          const currentStepRef = useRef(0);
          useEffect(() => { currentStepRef.current = demoStep; }, [demoStep]);

          // Función para simular tecleo en el input
          const startTypingInput = (fullText, nextStep) => {
              setIsSimulatingInput(true);
              skipInputTypingRef.current = false;
              let i = 0;
              const typeNextChar = () => {
                  if (skipInputTypingRef.current) {
                      setInputText(fullText);
                      setIsSimulatingInput(false);
                      setDemoStep(nextStep);
                      return;
                  }
                  if (i <= fullText.length) {
                      setInputText(fullText.substring(0, i));
                      i++;
                      typingTimeoutRef.current = setTimeout(typeNextChar, 15 + Math.random() * 15);
                  } else {
                      setIsSimulatingInput(false);
                      setDemoStep(nextStep);
                  }
              };
              typeNextChar();
          };

          useEffect(() => {
              const lastMessage = messages[messages.length - 1];

              const performScroll = () => {
                  if (!isTyping && lastMessage?.role === 'agent' && lastMessageRef.current) {
                      lastMessageRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
                      return;
                  }
                  chatEndRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
              };

              if (isChatOpen) {
                  performScroll();
                  const timeoutId = setTimeout(performScroll, 150);
                  return () => clearTimeout(timeoutId);
              }
          }, [messages, isTyping, isChatOpen]);

          useEffect(() => {
              if (textareaRef.current) {
                  textareaRef.current.style.height = 'auto';
                  textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px';
              }
          }, [inputText]);

          useEffect(() => {
              if (isChatOpen) {
                  if (demoStep === 0) {
                      setIsTyping(true);
                      setIsWaitingForAgentTrigger(true);
                  }
              }
          }, [isChatOpen]);

          const triggerAgentResponse = () => {
              const step = currentStepRef.current;
              setIsTyping(false);
              setIsWaitingForAgentTrigger(false);

              if (step === 0) {
                  setMessages([{
                    role: 'agent',
                    text: '¡Hola Elena! 👋 Aquí tienes tu propuesta para **JUNGLE en Movistar Arena Madrid**.\n\nDe las dos opciones que vimos, **JUNGLE** es la que mejor encaja con un plan en pareja, social y bailable.\n\n¿Quieres que revisemos juntos la mejor combinación antes de decidir?'
                  }]);
                  setDemoStep(1);
              } else if (step === 3) {
                  setMessages(prev => [
                    ...prev,
                    {
                        role: 'agent',
                        text: 'Perfecto, Elena. Para que **JUNGLE** sea una noche completa pensada para ti y tu pareja, te propongo estas **3 mejoras**:\n\n• **VIP Experience**: acceso prioritario, zona reservada y mejor visibilidad.\n• **After-party oficial**: continúa la noche después del concierto en un entorno exclusivo.\n• **Fever Insider**: acceso anticipado a próximos eventos y ventajas personalizadas.'
                    }
                  ]);
                  setDemoStep(4);
                  setShowServicesWidget(true);
              } else if (step === 7) {
                  setMessages(prev => [...prev, {
                    role: 'agent',
                    text: 'Te dejo la **propuesta de JUNGLE guardada**, Elena. Cuando quieras retomarla, la tendrás lista tal y como la has dejado.'
                  }]);
                  setBudgetStatus("saved");
                  setCartStatus("abandoned");
                  setLastChannel("web");
                  setNextBestAction("retarget_whatsapp");
                  setDemoStep(8);
              }
          };

          const handleSendMessage = (textOverride = null) => {
            const textToSend = textOverride || inputText.trim();
            if (!textToSend) return;

            setMessages(prev => [...prev, { role: 'user', text: textToSend }]);
            setInputText('');

            let nextStep;
            const currentStep = currentStepRef.current;

            if (currentStep === 2) {
                nextStep = 3;
                setIsTyping(true);
                setIsWaitingForAgentTrigger(true);
            }
            else if (currentStep === 6) {
                nextStep = 7;
                setIsTyping(true);
                setIsWaitingForAgentTrigger(true);
            }

            setDemoStep(nextStep);
          };

          // --- AÑADIR RECOMENDACIÓN AL CARRITO ---
          const handleAddToStay = (extra) => {
              // Si ya está añadido, no hacemos nada
              if (addedExtras.some(e => e.id === extra.id)) return;

              const newExtra = {
                  id: extra.id,
                  name: extra.title,
                  shortDesc: extra.shortDesc || 'Recomendación personalizada',
                  desc: extra.desc,
                  price: extra.unitPrice || 0,
                  selected: true
              };

              // Calculamos el nuevo total incluyendo la recomendación recién añadida
              const newExtras = [...addedExtras, newExtra];
              const newTotal = PRODUCT_DATA.basePrice + newExtras.reduce((acc, curr) => acc + curr.price, 0);
              const totalFormatted = newTotal.toLocaleString('es-ES', { minimumFractionDigits: 2 });

              setAddedExtras(newExtras);
              setExpandedServiceId(null);
              setLatestAddedExtra(extra.title);
              setSelectedRecommendation(extra.title);

              // El agente confirma el add e informa del nuevo importe total
              setMessages(prev => [...prev, {
                  role: 'agent',
                  text: `Perfecto, Elena. He añadido **${extra.title}** al paquete.\n\nTu importe total asciende ahora a **${totalFormatted} €**.\n\n¿Lo cerramos ahora y te aseguras tu plan?`
              }]);

              // Avanzamos al siguiente step solo en el primer add (para habilitar el cierre por teclado).
              // Las recomendaciones adicionales se pueden seguir añadiendo desde el widget.
              if (currentStepRef.current === 4) {
                  setDemoStep(5);
              }
          };

          useEffect(() => {
            const handleKeyDown = (e) => {
              if (e.key === "Alt" || e.key === "Control" || e.key === "Shift" || e.key === "Meta" || e.key === "Enter") return;

              if (isWaitingForAgentTrigger) {
                  e.preventDefault();
                  triggerAgentResponse();
                  return;
              }

              if (isSimulatingInput) {
                  e.preventDefault();
                  skipInputTypingRef.current = true;
                  return;
              }

              const step = currentStepRef.current;

              if (step === 2 || step === 6) {
                  e.preventDefault();
                  handleSendMessage();
                  return;
              }

              if (step === 1 && isChatOpen) {
                  e.preventDefault();
                  startTypingInput("Sí, JUNGLE encaja mejor con el plan. Pero antes de comprar quiero entender si merece la pena añadir VIP o alguna experiencia adicional.", 2);
              }
              else if (step === 5 && isChatOpen) {
                  e.preventDefault();
                  startTypingInput("Voy a darle una vuelta y lo reviso con calma.", 6);
              }
            };

            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [isChatOpen, isSimulatingInput, isWaitingForAgentTrigger, demoStep]);

          const handleNextImage = (e) => {
              e.stopPropagation();
              setCurrentImageIndex((prev) => (prev + 1) % PRODUCT_DATA.details.images.length);
          };

          const handlePrevImage = (e) => {
              e.stopPropagation();
              setCurrentImageIndex((prev) => (prev - 1 + PRODUCT_DATA.details.images.length) % PRODUCT_DATA.details.images.length);
          };

          const totalExtrasPrice = addedExtras.reduce((acc, curr) => acc + curr.price, 0);
          const totalPrice = PRODUCT_DATA.basePrice + totalExtrasPrice;

          return (
            <div className="min-h-screen flex flex-col relative text-[#E4E4E7] bg-[#0A0A0C]">
              <header className="bg-[#050505] sticky top-0 z-50 shadow-md border-b border-[#27272A]">
                <div className={`mx-auto w-full px-4 lg:px-8 h-16 flex items-center justify-between transition-all duration-700 ease-in-out ${isChatOpen ? 'max-w-[1400px]' : 'max-w-4xl'}`}>
                  <FeverLogo className="h-6" invert />
                  <div className="flex items-center gap-6 text-white text-sm font-medium">
                    <span className="hidden sm:flex items-center gap-2 text-gray-300"><i className="fa-solid fa-bolt text-xs text-[#FF2D95]"></i> Live Addict · Madrid</span>
                    <span className="hidden sm:flex items-center gap-2 text-gray-300"><i className="fa-regular fa-circle-user text-lg text-[#FF2D95]"></i> Hola, Elena</span>
                  </div>
                </div>
              </header>

              <main className={`flex-1 mx-auto w-full p-4 lg:p-8 flex flex-col lg:flex-row gap-6 transition-all duration-700 ease-in-out ${isChatOpen ? 'max-w-[1400px]' : 'max-w-4xl'}`}>

                {/* --- DETALLE DEL EVENTO (PANEL IZQUIERDO) --- */}
                <div className={`w-full flex flex-col transition-all duration-700 ease-in-out ${isChatOpen ? 'lg:w-[75%]' : 'lg:w-[100%]'} relative`}>

                  {/* --- WIDGET FLOTANTE AGENTFORCE: SERVICIOS PREMIUM --- */}
                  {showServicesWidget && (
                      <div className="sticky top-[88px] z-40 mb-6 fade-in shadow-2xl rounded-2xl overflow-hidden border-2 border-[#E9007F] bg-[#0E0E10]/98 backdrop-blur-md">
                          <div className="bg-gradient-to-r from-[#E9007F] to-[#C026D3] text-white p-4 flex justify-between items-center shrink-0">
                              <div className="flex items-center gap-3">
                                  <div className="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center shrink-0 overflow-hidden">
                                      <i className="fa-solid fa-wand-magic-sparkles text-white text-[14px]"></i>
                                  </div>
                                  <div>
                                      <span className="font-bold text-[14px] block">Recomendaciones para tu plan</span>
                                      <span className="text-[11px] text-pink-100">VIP Experience · After-party oficial · Fever Insider</span>
                                  </div>
                              </div>
                              <button onClick={() => setShowServicesWidget(false)} className="text-pink-100 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                          </div>

                          <div className="p-5 grid grid-cols-1 sm:grid-cols-3 gap-5">
                              {PREMIUM_SERVICES.map(extra => {
                                  const isExpanded = expandedServiceId === extra.id;
                                  const isHidden = expandedServiceId !== null && !isExpanded;

                                  if (isHidden) return null;

                                  return (
                                      <div key={extra.id} className={`bg-[#18181B] border border-[#27272A] rounded-xl overflow-hidden shadow-sm flex ${isExpanded ? 'flex-col sm:flex-row sm:col-span-3' : 'flex-col'} transition-all duration-300 hover:shadow-md hover:border-[#E9007F]`}>
                                          <img src={extra.image} alt={extra.title} className={`${isExpanded ? 'sm:w-1/3 h-48 sm:h-auto' : 'h-32 w-full'} object-cover`} />
                                          <div className="p-5 flex-1 flex flex-col">

                                              <div className="flex justify-between items-start mb-2">
                                                  <h4 className="font-bold text-white text-[15px] uppercase tracking-wide">{extra.title}</h4>
                                                  {isExpanded && <button onClick={() => setExpandedServiceId(null)} className="text-gray-400 hover:text-[#FF2D95] transition-colors"><i className="fa-solid fa-xmark text-lg"></i></button>}
                                              </div>

                                              <p className="text-[#FF2D95] font-bold text-[14px] mb-3">{extra.price} {isExpanded && <span className="text-gray-500 font-normal text-[11px]">aplicado al plan</span>}</p>

                                              {isExpanded ? (
                                                  <div className="fade-in mb-1 flex-1 flex flex-col">
                                                      {extra.tags && (
                                                          <div className="flex flex-wrap gap-2 mb-4">
                                                              {extra.tags.map((tag, i) => <span key={i} className="text-[10px] bg-[#27272A] text-gray-300 px-2.5 py-1 rounded font-medium">{tag}</span>)}
                                                          </div>
                                                      )}
                                                      <p className="text-[13px] text-gray-200 mb-4 leading-relaxed">{extra.desc}</p>

                                                      {extra.includes && (
                                                          <div className="mb-4">
                                                              <h5 className="text-[13px] font-bold text-white mb-2">El upgrade incluye:</h5>
                                                              <ul className="text-[13px] text-gray-300 space-y-1.5 pl-5 list-disc">
                                                                  {extra.includes.map((inc, i) => <li key={i}>{inc}</li>)}
                                                              </ul>
                                                          </div>
                                                      )}

                                                      {extra.comments && (
                                                          <p className="text-[11px] text-gray-500 mb-5"><strong className="text-gray-400">Notas:</strong> {extra.comments}</p>
                                                      )}

                                                      {/* RECOMENDACIÓN AGENTFORCE PARA VIP EXPERIENCE */}
                                                      {extra.id === 'vip_experience' && (
                                                          <div className="bg-gradient-to-br from-[#fdf2f8]/10 to-[#faf5ff]/10 border border-[#fbcfe8]/30 p-4 rounded-xl mb-5 flex gap-3.5 items-start shadow-sm">
                                                              <div className="w-8 h-8 rounded-full fever-gradient flex items-center justify-center shrink-0 shadow-inner overflow-hidden">
                                                                  <i className="fa-solid fa-wand-magic-sparkles text-white text-[12px]"></i>
                                                              </div>
                                                              <div>
                                                                  <p className="text-[13px] text-[#FF2D95] font-bold mb-1">Por qué te lo recomendamos</p>
                                                                  <p className="text-[12px] text-gray-200 leading-relaxed">Esta sugerencia se basa en tu <strong className="text-white">afinidad por experiencias nocturnas premium</strong>, tu <strong className="text-white">patrón de compra en pareja</strong> y tu <strong className="text-white">compra previa de entradas de mayor valor</strong>.</p>
                                                              </div>
                                                          </div>
                                                      )}

                                                      <div className="mt-auto flex justify-between items-center pt-4 border-t border-[#27272A]">

                          <div className="w-6 h-6 rounded-full fever-gradient flex items-center justify-center shrink-0 mr-2 shadow-sm"><i className="fa-solid fa-bolt text-white text-[10px]"></i></div>
                          <div className="bg-[#18181B] border border-[#E9007F]/40 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm flex items-center gap-1.5">
                            <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                            <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                            <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                          </div>
                        </div>
                      )}
                      <div ref={chatEndRef} />
                    </div>

                    <div className="p-3 bg-[#18181B] border-t border-[#27272A] shrink-0">
                      <form onSubmit={(e) => { e.preventDefault(); handleSendMessage(); }} className="relative flex flex-col">
                        <div className="relative flex items-end gap-2">
                            <textarea ref={textareaRef} value={inputText} onChange={(e) => setInputText(e.target.value)} rows="1" placeholder="Escribe tu mensaje..." className="chat-textarea w-full bg-[#0E0E10] border border-[#27272A] rounded-2xl py-2.5 pl-4 pr-12 text-[13px] text-white outline-none focus:border-[#E9007F] focus:ring-2 focus:ring-[#E9007F]/30 transition-all overflow-hidden placeholder-gray-600" readOnly={isSimulatingInput} />
                            <button type="submit" disabled={!inputText.trim() || isSimulatingInput} className="absolute right-1.5 bottom-1.5 p-2 fever-gradient text-white rounded-full hover:opacity-90 disabled:opacity-40 transition shadow-sm">
                                <i className="fa-solid fa-paper-plane text-[11px] ml-[-1px]"></i>
                            </button>
                        </div>
                      </form>
                      <div className="flex items-center justify-center gap-1 mt-2 text-[10px] text-gray-500 font-medium text-center"><i className="fa-solid fa-sparkles text-[#FF2D95]"></i> Agentforce actualiza la web en tiempo real</div>
                    </div>
                  </div>
                )}
              </main>

              {!isChatOpen && (
                <button onClick={() => setIsChatOpen(true)} className="fixed bottom-6 right-6 lg:bottom-10 lg:right-10 fever-gradient text-white p-4 rounded-full shadow-2xl shadow-[#E9007F]/40 hover:scale-105 transition-all duration-300 flex items-center gap-3 z-50 group fade-in">
                  <div className="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center shrink-0 backdrop-blur"><i className="fa-solid fa-bolt text-white"></i></div>
                  <span className="font-bold hidden sm:block max-w-0 overflow-hidden group-hover:max-w-[220px] transition-all duration-500 whitespace-nowrap text-white uppercase tracking-wider text-[12px]">Hablar con Fever Agentforce</span>
                  <span className="absolute top-0 right-0 w-3.5 h-3.5 bg-[#00D4FF] border-2 border-[#0A0A0C] rounded-full pulse-dot"></span>
                </button>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
