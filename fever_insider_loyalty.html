                                        <p className="text-[11px] text-gray-400">Faltan <strong className="text-[#FF2D95]">6 eventos</strong></p>
                                    </div>
                                </div>

                                {/* Progress bar */}
                                <div className="mb-8 relative">
                                    <div className="flex justify-between text-[10px] uppercase tracking-widest text-gray-500 font-semibold mb-2">
                                        <span>Live Addict</span>
                                        <span>Big Shot</span>
                                    </div>
                                    <div className="h-3 bg-[#18181B] rounded-full overflow-hidden relative">
                                        <div className="h-full fever-gradient rounded-full" style={{ width: '40%' }}></div>
                                    </div>
                                    <div className="flex justify-between text-[10px] text-gray-500 mt-1.5">
                                        <span>4 eventos</span>
                                        <span>10 eventos</span>
                                    </div>
                                </div>

                                {/* Quick actions */}
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 relative">
                                    <div className="bg-[#0A0A0C] border border-[#18181B] rounded-xl p-4">
                                        <p className="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Puntos acumulados</p>
                                        <p className="text-[22px] font-extrabold text-white mt-1 font-numbers">1.840 <span className="text-[12px] text-gray-500 font-medium">pts</span></p>
                                    </div>
                                    <div className="bg-[#0A0A0C] border border-[#18181B] rounded-xl p-4">
                                        <p className="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Acceso anticipado</p>
                                        <p className="text-[22px] font-extrabold text-white mt-1">24h <span className="text-[12px] text-gray-500 font-medium">antes</span></p>
                                    </div>
                                    <div className="bg-[#0A0A0C] border border-[#18181B] rounded-xl p-4">
                                        <p className="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Descuento VIP</p>
                                        <p className="text-[22px] font-extrabold text-white mt-1">5%</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="py-24 px-6 border-t border-[#18181B]">
                        <div className="max-w-3xl mx-auto">
                            <p className="text-[11px] uppercase tracking-[0.2em] text-[#FF2D95] font-bold mb-3 text-center">FAQ</p>
                            <h2 className="text-[40px] sm:text-[52px] leading-tight font-extrabold text-white text-center mb-12 tracking-tight">Preguntas frecuentes</h2>

                            <div className="space-y-3">
                                {FAQS.map((faq, i) => {
                                    const isOpen = openFaq === i;
                                    return (
                                        <div key={i} className="card-dark rounded-xl overflow-hidden">
                                            <button
                                                onClick={() => setOpenFaq(isOpen ? null : i)}
                                                className="w-full px-5 py-4 flex items-center justify-between text-left hover:bg-[#18181B]/50 transition">
                                                <span className="text-[14px] font-semibold text-white">{faq.q}</span>
                                                <i className={`fa-solid fa-chevron-down text-[12px] text-[#FF2D95] transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}></i>
                                            </button>
                                            {isOpen && (
                                                <div className="px-5 pb-4 fade-in">
                                                    <p className="text-[13px] text-gray-400 leading-relaxed">{faq.a}</p>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </section>

                    {/* CTA FINAL */}
                    <section className="py-24 px-6 border-t border-[#18181B] bg-gradient-to-b from-[#0A0A0C] to-[#050505]">
                        <div className="max-w-4xl mx-auto text-center relative">
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-[#E9007F]/10 rounded-full blur-3xl pointer-events-none"></div>

                            <h2 className="text-[40px] sm:text-[64px] leading-[0.95] font-extrabold text-white tracking-tight mb-6 relative">
                                Empieza a vivir más <span className="fever-gradient-text">Fever</span>
                            </h2>
                            <p className="text-[16px] text-gray-300 max-w-2xl mx-auto leading-relaxed mb-10 relative">
                                Activa tu cuenta y empieza a sumar progreso desde tu próximo evento.
                            </p>
                            <div className="flex flex-col sm:flex-row gap-3 justify-center relative">
                                <button className="btn-primary text-white font-bold uppercase tracking-wider text-[13px] px-8 py-4 rounded-xl glow">
                                    Activar mi cuenta
                                </button>
                                <button className="bg-white/5 hover:bg-white/10 border border-white/15 text-white font-bold uppercase tracking-wider text-[13px] px-8 py-4 rounded-xl transition">
                                    Explorar eventos
                                </button>
                            </div>

                            <p className="text-[10px] text-gray-600 mt-12 uppercase tracking-widest">
                                <i className="fa-solid fa-lock mr-1.5"></i> Concepto de demo · Programa Fever Insider
                            </p>
                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer className="border-t border-[#18181B] py-8 px-6 bg-[#050505]">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <FeverLogo className="h-4" invert />
                                <span className="text-gray-600">·</span>
                                <span className="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Insider</span>
                            </div>
                            <p className="text-[11px] text-gray-600">Términos y condiciones · Privacidad · Cookies</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FeverInsiderPage />);
    </script>
</body>
</html>
