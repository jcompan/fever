<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp · Fever Agentforce</title>
    <!-- Favicon -->
    <link rel="icon" href="https://feverup.com/logo/fever-logo-black.svg" type="image/svg+xml">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #d1d7db;
        }
        .bg-chat {
            background-color: #efeae2;
            background-image: url("https://w0.peakpx.com/wallpaper/508/606/HD-wallpaper-whatsapp-background-cool-dark-green-light-pattern-patterns-smart-texture-theme.jpg");
            background-blend-mode: overlay;
            background-size: cover;
            background-position: center;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }

        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sombra muy sutil estilo WhatsApp */
        .wa-shadow {
            box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
        }

        /* Burbujas WhatsApp */
        .wa-bubble-agent { border-top-left-radius: 0; }
        .wa-bubble-user { border-top-right-radius: 0; }
        .wa-bubble-agent::before {
            content: '';
            position: absolute;
            top: 0;
            left: -8px;
            width: 8px;
            height: 9px;
            background-color: #ffffff;
            clip-path: polygon(100% 0, 100% 100%, 0 0);
        }
        .wa-bubble-user::before {
            content: '';
            position: absolute;
            top: 0;
            right: -8px;
            width: 8px;
            height: 9px;
            background-color: #d9fdd3;
            clip-path: polygon(0 0, 100% 0, 0 100%);
        }

        /* Avatar Fever con gradiente */
        .fever-avatar-gradient {
            background: linear-gradient(135deg, #E9007F 0%, #C026D3 100%);
        }

        /* Note de Agentforce / contexto Data Cloud */
        .data-cloud-note {
            background: linear-gradient(135deg, rgba(233,0,127,0.08) 0%, rgba(192,38,211,0.05) 100%);
            border: 1px solid rgba(233,0,127,0.25);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FEVER_LOGO = "https://feverup.com/logo/fever-logo-black.svg";

        function FeverAvatar({ size = "w-full h-full" }) {
            return (
                <div className={`${size} bg-black rounded-full flex items-center justify-center`}>
                    <img
                        src={FEVER_LOGO}
                        alt="Fever"
                        className="w-3/5 h-auto object-contain"
                        style={{ filter: 'brightness(0) invert(1)' }}
                    />
                </div>
            );
        }

        function WhatsAppDemo() {
            const [clockTime, setClockTime] = useState("19:14");

            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [demoStep, setDemoStep] = useState(0);

            const [isSimulatingInput, setIsSimulatingInput] = useState(false);
            const skipInputTypingRef = useRef(false);
            const typingTimeoutRef = useRef(null);

            const chatEndRef = useRef(null);
            const inputRef = useRef(null);

            const demoStepRef = useRef(demoStep);
            const isSimulatingRef = useRef(isSimulatingInput);
            const inputTextRef = useRef(inputText);

            useEffect(() => { demoStepRef.current = demoStep; }, [demoStep]);
            useEffect(() => { isSimulatingRef.current = isSimulatingInput; }, [isSimulatingInput]);
            useEffect(() => { inputTextRef.current = inputText; }, [inputText]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
            }, [messages, isTyping, inputText]);

            useEffect(() => {
                if (inputRef.current) {
                    inputRef.current.style.height = '24px';
                    inputRef.current.style.height = inputRef.current.scrollHeight + 'px';
                }
            }, [inputText]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === "Alt" || e.key === "Control" || e.key === "Shift" || e.key === "Meta") return;

                    if (isSimulatingRef.current) {
                        e.preventDefault();
                        skipInputTypingRef.current = true;
                        return;
                    }

                    e.preventDefault();

                    const currentStep = demoStepRef.current;

                    const startTypingInput = (fullText, nextStep) => {
                        setIsSimulatingInput(true);
                        skipInputTypingRef.current = false;
                        let i = 0;

                        if (inputRef.current) inputRef.current.focus();

                        const typeNextChar = () => {
                            if (skipInputTypingRef.current) {
                                setInputText(fullText);
                                inputTextRef.current = fullText;
                                setIsSimulatingInput(false);
                                setDemoStep(nextStep);
                                if (inputRef.current) inputRef.current.scrollTop = inputRef.current.scrollHeight;
                                return;
                            }
                            if (i <= fullText.length) {
                                const currentText = fullText.substring(0, i);
                                setInputText(currentText);
                                inputTextRef.current = currentText;
                                if (inputRef.current) inputRef.current.scrollTop = inputRef.current.scrollHeight;
                                i++;
                                typingTimeoutRef.current = setTimeout(typeNextChar, 30 + Math.random() * 45);
                            } else {
                                setIsSimulatingInput(false);
                                setDemoStep(nextStep);
                            }
                        };
                        typeNextChar();
                    };

                    // Step 0: Fever Agentforce mensaje proactivo de retargeting
                    if (currentStep === 0) {
                        setMessages([{
                            id: 1,
                            sender: 'agent',
                            text: 'Hola Elena 👋 Soy de **Fever**.\n\nVeo que dejaste tu plan para **JUNGLE en Movistar Arena Madrid** sin terminar, con tu **VIP Experience** ya añadido.\n\n¿Te paso un enlace para que lo termines en un par de toques?',
                            time: "19:14",
                            date: "Hoy",
                            status: 'read'
                        }]);
                        setDemoStep(1);
                    }
                    // Step 1: Elena teclea su respuesta
                    else if (currentStep === 1) {
                        startTypingInput("Sí, enviarme enlace de pago", 2);
                    }
                    // Step 2: Elena envía el mensaje
                    else if (currentStep === 2) {
                        handleSendMessage(e);
                    }
                    // Step 3: Fever Agentforce envía deeplink seguro
                    else if (currentStep === 3) {
                        setIsTyping(false);
                        setClockTime("19:15");
                        setMessages(prev => [...prev, {
                            id: Date.now(),
                            sender: 'agent',
                            text: '¡Perfecto! Aquí lo tienes:\n\n🔗 https://app.feverup.com/checkout/FEV-49281\n\n**Tu plan:**\n• JUNGLE en Movistar Arena Madrid\n• 15 de junio · Madrid\n• 2 entradas\n• VIP Experience\n• Fever Insider\n\nLo encontrarás todo listo para confirmar.',
                            time: "19:15",
                            date: "Hoy",
                            status: 'read',
                            linkPreview: {
                                type: "large",
                                title: "Termina tu plan en Fever",
                                desc: "JUNGLE · 2 entradas con VIP Experience listas para confirmar.",
                                domain: "app.feverup.com",
                                image: "https://images.unsplash.com/photo-1429962714451-bb934ecdc4ec?auto=format&fit=crop&w=800&q=80"
                            }
                        }]);
                        setDemoStep(4);
                    }
                    // Step 4: Elena confirma que pagará desde la app
                    else if (currentStep === 4) {
                        startTypingInput("Perfecto, lo pago ahora desde la app", 5);
                    }
                    // Step 5: Elena envía el mensaje
                    else if (currentStep === 5) {
                        handleSendMessage(e);
                    }
                    // Step 6: Cierre del agente con reserva del carrito
                    else if (currentStep === 6) {
                        setIsTyping(false);
                        setClockTime("19:16");
                        setMessages(prev => [...prev, {
                            id: Date.now(),
                            sender: 'agent',
                            text: '¡Genial, Elena! Te lo dejo apartado unos minutos. En cuanto termines, te llega la confirmación al instante.',
                            time: "19:16",
                            date: "Hoy",
                            status: 'read'
                        }]);
                        setDemoStep(7);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const handleSendMessage = (e) => {
                if (e && e.preventDefault) e.preventDefault();

                const currentInput = inputTextRef.current || inputText;
                if (!currentInput.trim() || isSimulatingRef.current) return;

                if (inputRef.current) inputRef.current.blur();

                const currentStep = demoStepRef.current;
                let msgTime = "19:14";
                if (currentStep === 5) msgTime = "19:15";
                setClockTime(msgTime);

                setMessages(prev => [...prev, {
                    id: Date.now(),
                    sender: 'user',
                    text: currentInput.trim(),
                    time: msgTime,
                    date: "Hoy",
                    status: 'sent'
                }]);

                setInputText('');
                inputTextRef.current = '';

                if (currentStep === 2) {
                    setIsTyping(true);
                    setDemoStep(3);
                } else if (currentStep === 5) {
                    setIsTyping(true);
                    setDemoStep(6);
                }
            };

            const formatText = (text) => {
                const parts = text.split(/(\*\*.*?\*\*)/g);
                return parts.map((part, index) => {
                    if (part.startsWith('**') && part.endsWith('**')) {
                        return <strong key={index}>{part.slice(2, -2)}</strong>;
                    }
                    return part;
                });
            };

            return (
                <div className="h-screen w-full flex items-center justify-center bg-[#d1d7db] sm:py-6">
                    {/* iPhone Container */}
                    <div className="w-full h-full sm:h-[90vh] sm:max-h-[932px] sm:w-[430px] bg-white sm:rounded-[55px] sm:border-[16px] sm:border-black shadow-2xl flex flex-col overflow-hidden relative ring-1 ring-gray-900/10">

                        {/* Dynamic Island */}
                        <div className="hidden sm:block absolute top-3 left-1/2 -translate-x-1/2 w-[126px] h-[37px] bg-black rounded-full z-50"></div>

                        {/* iOS Status Bar */}
                        <div className="hidden sm:flex h-[54px] bg-[#008069] w-full items-center justify-between px-8 text-white font-semibold text-[14px] shrink-0 pt-3 z-40 relative">
                            <span className="w-16 text-center ml-1">{clockTime}</span>
                            <div className="flex gap-2 items-center text-[14px] mr-1">
                                <i className="fa-solid fa-signal"></i>
                                <i className="fa-solid fa-wifi"></i>
                                <i className="fa-solid fa-battery-full text-[17px]"></i>
                            </div>
                        </div>

                        {/* WhatsApp Header */}
                        <div className="bg-[#008069] text-white flex items-center px-4 pb-3 pt-3 sm:pt-1 shadow-md z-10 shrink-0">
                            <div className="flex items-center gap-3 flex-1 cursor-pointer">
                                <i className="fa-solid fa-arrow-left text-xl sm:hidden"></i>
                                <i className="fa-solid fa-chevron-left text-2xl hidden sm:block mr-1 text-green-100"></i>
                                <div className="relative">
                                    <div className="w-10 h-10 rounded-full overflow-hidden shadow-sm">
                                        <FeverAvatar />
                                    </div>
                                    <div className="absolute -bottom-1 -right-1 bg-white rounded-full w-4 h-4 flex items-center justify-center shadow-sm">
                                        <i className="fa-solid fa-certificate text-[#008069] text-[12px]"></i>
                                        <i className="fa-solid fa-check absolute text-white text-[8px] mt-[1px]"></i>
                                    </div>
                                </div>
                                <div>
                                    <h1 className="font-semibold text-[16px] leading-tight flex items-center gap-1">
                                        Fever
                                    </h1>
                                    <p className="text-[12px] text-green-100">Cuenta de empresa verificada</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-5 text-xl">
                                <i className="fa-solid fa-video cursor-pointer hover:text-gray-200 transition-colors"></i>
                                <i className="fa-solid fa-phone cursor-pointer hover:text-gray-200 transition-colors"></i>
                                <i className="fa-solid fa-ellipsis-vertical cursor-pointer hover:text-gray-200 transition-colors"></i>
                            </div>
                        </div>

                        {/* Chat Area */}
                        <div className="flex-1 bg-chat overflow-y-auto px-3 py-2 flex flex-col relative">

                            {/* Security Banner */}
                            <div className="flex justify-center my-2 shrink-0">
                                <div className="bg-[#ffeecd] text-[#544c45] text-[11px] px-3 py-1.5 rounded-lg text-center shadow-sm max-w-[90%] leading-snug flex gap-2 items-center">
                                    <i className="fa-solid fa-lock text-[#008069] text-[10px]"></i>
                                    <span>Los mensajes y las llamadas están cifrados de extremo a extremo. Nadie fuera de este chat puede leerlos ni escucharlos.</span>
                                </div>
                            </div>

                            {(() => {
                                let currentDate = null;
                                return messages.map((msg, index) => {
                                    const isNewDate = msg.date !== currentDate;
                                    currentDate = msg.date;
                                    const isNewMessage = true;

                                    const prevMsg = messages[index - 1];
                                    const isSameSenderAsPrev = !!prevMsg && prevMsg.sender === msg.sender && !isNewDate;
                                    const showTail = !isSameSenderAsPrev;
                                    const rowSpacingClass = isSameSenderAsPrev ? 'mt-[2px]' : 'mt-2';

                                    return (
                                        <React.Fragment key={msg.id}>
                                            {isNewDate && (
                                                <div className={`flex justify-center my-2 shrink-0 ${isNewMessage ? 'fade-in' : ''}`}>
                                                    <span className="bg-[#e1f3fb] text-[#54656f] text-xs px-3 py-1 rounded-lg shadow-sm font-medium uppercase tracking-wide">
                                                        {msg.date}
                                                    </span>
                                                </div>
                                            )}
                                            <div className={`flex ${msg.sender === 'user' ? 'justify-end pr-2' : 'justify-start pl-2'} ${rowSpacingClass} shrink-0 ${isNewMessage ? 'fade-in' : ''}`}>
                                                <div className={`relative max-w-[78%] rounded-[7.5px] pl-[9px] pr-[9px] pt-[6px] pb-[20px] text-[14.2px] leading-[19px] wa-shadow ${msg.sender === 'user' ? 'bg-[#d9fdd3]' : 'bg-white'} ${showTail ? (msg.sender === 'user' ? 'wa-bubble-user' : 'wa-bubble-agent') : ''} whitespace-pre-wrap`}>

                                                    {/* Link Preview component */}
                                                    {msg.linkPreview && (
                                                        <div className={`mb-1.5 mt-0.5 bg-black/5 rounded-md overflow-hidden border border-black/5 flex w-full cursor-pointer hover:bg-black/10 transition-colors ${msg.linkPreview.type === 'small' ? 'flex-row items-center h-[88px]' : 'flex-col'}`}>
                                                            <div className={`${msg.linkPreview.type === 'small' ? 'w-[88px] h-full shrink-0 bg-white/50 flex items-center justify-center p-3 border-r border-black/5' : 'w-full'}`}>
                                                                <img src={msg.linkPreview.image} alt="Link preview" className={`${msg.linkPreview.type === 'small' ? 'w-full h-full object-contain drop-shadow-sm' : 'w-full h-32 object-cover border-b border-black/5'}`} />
                                                            </div>
                                                            <div className="p-2.5 flex-1 min-w-0">
                                                                <h3 className="text-[#111b21] font-semibold text-[13.5px] line-clamp-1">{msg.linkPreview.title}</h3>
                                                                <p className="text-[#667781] text-[12.5px] line-clamp-2 mt-0.5 leading-snug">{msg.linkPreview.desc}</p>
                                                                <p className="text-[#8696a0] text-[10.5px] mt-1.5 uppercase font-medium tracking-wide">{msg.linkPreview.domain}</p>
                                                            </div>
                                                        </div>
                                                    )}

                                                    <div className="text-[#111b21]">
                                                        {formatText(msg.text)}
                                                    </div>

                                                    {/* Note Agentforce / Data Cloud (microcopy) */}
                                                    {msg.note && (
                                                        <div className="data-cloud-note rounded-md mt-2 px-2.5 py-1.5 flex items-center gap-1.5 text-[10px] text-[#831843]">
                                                            <i className="fa-solid fa-sparkles text-[#E9007F]"></i>
                                                            <span className="leading-snug">{msg.note}</span>
                                                        </div>
                                                    )}

                                                    <div className="absolute bottom-[3px] right-[7px] flex items-center gap-[3px] text-[11px] text-[#667781] leading-none">
                                                        <span>{msg.time}</span>
                                                        {msg.sender === 'user' && (
                                                            <i className="fa-solid fa-check-double text-[#53bdeb] text-[12px]"></i>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    );
                                });
                            })()}

                            {isTyping && (
                                <div className="flex justify-start pl-2 mt-2 fade-in shrink-0">
                                    <div className="relative bg-white rounded-[7.5px] wa-bubble-agent wa-shadow px-4 py-3 flex items-center gap-1">
                                        <div className="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></div>
                                        <div className="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></div>
                                        <div className="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></div>
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef} className="shrink-0 h-1"></div>
                        </div>

                        {/* Input Bar */}
                        <div className="bg-[#f0f2f5] p-2 flex items-end gap-2 shrink-0">
                            <div className="text-gray-500 text-2xl flex items-center h-10 gap-3 px-2 cursor-pointer mb-0.5">
                                <i className="fa-regular fa-face-smile hover:text-gray-600 transition-colors"></i>
                                <i className="fa-solid fa-paperclip hover:text-gray-600 transition-colors"></i>
                            </div>

                            <form onSubmit={handleSendMessage} className="flex-1 flex bg-white rounded-xl overflow-hidden px-3 py-2 shadow-sm mb-0.5">
                                <textarea
                                    ref={inputRef}
                                    value={inputText}
                                    onChange={(e) => { if (!isSimulatingInput) setInputText(e.target.value); }}
                                    placeholder="Escribe un mensaje"
                                    className="w-full text-[15px] outline-none text-[#111b21] bg-transparent resize-none overflow-y-auto leading-[22px] pt-0.5"
                                    rows="1"
                                    style={{ minHeight: '24px', maxHeight: '110px' }}
                                    readOnly={demoStep >= 7}
                                />
                            </form>

                            <div className="h-10 flex items-center justify-center shrink-0 mb-0.5">
                                {inputText.trim() ? (
                                    <button onClick={handleSendMessage} disabled={isSimulatingInput} className="w-10 h-10 rounded-full bg-[#00a884] text-white flex items-center justify-center shadow-sm cursor-pointer hover:bg-[#008f6f] transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                                        <i className="fa-solid fa-paper-plane ml-1 text-[16px]"></i>
                                    </button>
                                ) : (
                                    <div className="w-10 h-10 rounded-full bg-[#00a884] text-white flex items-center justify-center shadow-sm cursor-pointer hover:bg-[#008f6f] transition-colors">
                                        <i className="fa-solid fa-microphone text-[16px]"></i>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* iOS Home Indicator */}
                        <div className="hidden sm:flex w-full h-[34px] bg-[#f0f2f5] items-end justify-center pb-2 shrink-0">
                            <div className="w-[134px] h-[5px] bg-gray-800 rounded-full"></div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WhatsAppDemo />);
    </script>
</body>
</html>
